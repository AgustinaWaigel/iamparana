<style>
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #f6f1ea; -webkit-font-smoothing: antialiased; }
  ::selection { background: #e3a92c; color: #3a1508; }

  @keyframes kb {
    from { transform: scale(1.02) translate(0,0); }
    to   { transform: scale(1.13) translate(-1.5%, -1.5%); }
  }
  .kenburns { animation: kb 8s ease-out forwards; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fadeup { animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) both; }

  @keyframes revIn {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .reveal { opacity: 0; }
  .reveal.in { animation: revIn .7s cubic-bezier(.2,.7,.2,1) forwards; }

  .no-scrollbar::-webkit-scrollbar { height: 0; width: 0; }
  .no-scrollbar { scrollbar-width: none; }

  /* texto con borde fino para títulos sobre foto */
  .titlewrap { text-wrap: balance; }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
